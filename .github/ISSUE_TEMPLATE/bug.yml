name: Bug
description: Something does not work the way it should. 🇵🇱 Coś nie działa tak, jak powinno.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce 🇵🇱 Kroki, żeby to powtórzyć
      placeholder: "1. Run `pnpm dev`\n2. Open http://localhost:3000\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual 🇵🇱 Co miało być, a co jest
    validations:
      required: true
