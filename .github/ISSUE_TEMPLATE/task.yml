name: Task
description: A piece of work small enough for one pull request.
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer checks it — a test, a screen, a command.
    validations:
      required: true
